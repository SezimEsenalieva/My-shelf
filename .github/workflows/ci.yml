# Проверки — на каждый pull request.
# Публикация на GitHub Pages — после слияния в main. Тесты при этом не повторяются:
# они уже прошли в pull request, поэтому сайт обновляется быстрее (меньше минуты).
name: CI и деплой

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Линтер, типы, тесты
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Установить WebKit для e2e
        run: npx playwright install --with-deps webkit
      - name: e2e-тесты (WebKit, iPhone)
        run: npx playwright test --project=iphone-webkit

  build:
    name: Сборка сайта
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Необязательный ключ Google Books. Если его нет в настройках репозитория — пусто.
          VITE_GOOGLE_BOOKS_KEY: ${{ vars.GOOGLE_BOOKS_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Деплой на GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
